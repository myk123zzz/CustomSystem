<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CustomSystem · 智能客服</title>
<style>
  /* =================================================================
     全局样式
     ================================================================= */
  :root {
    --bg: #f5f5f0;
    --surface: #ffffff;
    --primary: #4f46e5;
    --primary-light: #818cf8;
    --text: #1e1b4b;
    --text-secondary: #6b7280;
    --bubble-user: #4f46e5;
    --bubble-agent: #ffffff;
    --border: #e5e7eb;
    --danger: #ef4444;
    --radius: 16px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* =================================================================
     顶部栏
     ================================================================= */
  .header {
    background: var(--primary);
    color: #fff;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(79,70,229,.2);
    z-index: 10;
  }
  .header .dot {
    width: 10px; height: 10px;
    background: #34d399;
    border-radius: 50%;
    animation: pulse-dot 2s infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: .4; }
  }
  .header h1 { font-size: 16px; font-weight: 600; letter-spacing: .5px; }
  .header span { font-size: 12px; opacity: .75; margin-left: auto; }
  /* 右上角：跳转后台按钮 */
  .header .nav-btn {
    display: inline-flex; align-items: center; gap: 6px;
    margin-left: 16px;
    padding: 6px 14px;
    background: rgba(255,255,255,.15);
    color: #fff;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 8px;
    font-size: 13px;
    text-decoration: none;
    transition: background .2s;
  }
  .header .nav-btn:hover { background: rgba(255,255,255,.28); }

  /* =================================================================
     消息区域
     ================================================================= */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  /* 消息行 */
  .msg-row {
    display: flex;
    gap: 10px;
    max-width: 85%;
    animation: slide-up .3s ease;
  }
  @keyframes slide-up {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg-row.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }
  .msg-row.agent {
    align-self: flex-start;
  }

  /* 头像 */
  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .msg-row.agent .avatar { background: #e0e7ff; }
  .msg-row.user  .avatar { background: #c7d2fe; }

  /* 气泡 */
  .bubble {
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.6;
    word-break: break-word;
    white-space: pre-wrap;
    box-shadow: var(--shadow);
  }
  .msg-row.agent .bubble {
    background: var(--bubble-agent);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }
  .msg-row.user .bubble {
    background: var(--bubble-user);
    border-bottom-right-radius: 4px;
    color: #fff;
  }

  /* 时间戳 */
  .time {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 4px;
    padding: 0 4px;
  }

  /* =================================================================
     打字指示器 —— 三个跳动的点
     ================================================================= */
  .typing-row {
    display: flex;
    gap: 10px;
    align-self: flex-start;
    align-items: center;
    animation: slide-up .3s ease;
  }
  .typing-dots {
    display: flex;
    gap: 4px;
    padding: 12px 16px;
  }
  .typing-dots span {
    width: 8px; height: 8px;
    background: #a5b4fc;
    border-radius: 50%;
    animation: bounce 1.4s infinite both;
  }
  .typing-dots span:nth-child(2) { animation-delay: .2s; }
  .typing-dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(.6); }
    40% { transform: scale(1); }
  }

  /* =================================================================
     输入区域
     ================================================================= */
  .input-area {
    padding: 14px 24px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .input-area textarea {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    max-height: 120px;
    line-height: 1.5;
    transition: border-color .2s;
  }
  .input-area textarea:focus {
    border-color: var(--primary-light);
  }
  .input-area button {
    width: 44px; height: 44px;
    border: none;
    background: var(--primary);
    color: #fff;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    flex-shrink: 0;
    transition: background .2s, transform .1s;
    display: flex; align-items: center; justify-content: center;
  }
  .input-area button:hover { background: #4338ca; }
  .input-area button:active { transform: scale(.95); }
  .input-area button:disabled {
    background: #c7d2fe;
    cursor: not-allowed;
  }

  /* =================================================================
     欢迎卡片
     ================================================================= */
  .welcome {
    text-align: center;
    padding: 60px 20px 20px;
    color: var(--text-secondary);
  }
  .welcome .icon { font-size: 48px; margin-bottom: 12px; }
  .welcome h2 { font-size: 20px; color: var(--text); margin-bottom: 6px; }
  .welcome p  { font-size: 13px; }

  /* 滚动条美化 */
  .chat-area::-webkit-scrollbar { width: 6px; }
  .chat-area::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
</style>
</head>
<body>

<!-- ====== 顶部栏 ====== -->
<div class="header">
  <div class="dot"></div>
  <h1>CustomSystem 智能客服</h1>
  <span>DeepSeek</span>
  <a class="nav-btn" href="/admin" title="查看客服后台">📊 后台</a>
</div>

<!-- ====== 消息区域 ====== -->
<div class="chat-area" id="chatArea">
  <div class="welcome" id="welcomeCard">
    <div class="icon">🤖</div>
    <h2>你好呀～ 有什么可以帮你的？</h2>
    <p>试试问我商品咨询、订单查询、售后问题</p>
  </div>
</div>

<!-- ====== 输入区域 ====== -->
<div class="input-area">
  <textarea id="userInput" rows="1" placeholder="输入消息… (Enter 发送)" autofocus></textarea>
  <button id="sendBtn" title="发送">➤</button>
</div>

<script>
  // ===================================================================
  // DOM 元素
  // ===================================================================
  const chatArea  = document.getElementById('chatArea');
  const userInput = document.getElementById('userInput');
  const sendBtn   = document.getElementById('sendBtn');
  const welcomeCard = document.getElementById('welcomeCard');

  let sessionKey = 'web:' + Date.now();
  let isWaiting = false;  // 是否正在等待 Agent 回复

  // ===================================================================
  // 工具函数
  // ===================================================================
  function now() {
    return new Date().toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
  }

  // ===================================================================
  // 添加消息到聊天区
  // ===================================================================
  function addMessage(role, text) {
    // 隐藏欢迎卡片
    if (welcomeCard) welcomeCard.style.display = 'none';

    const isUser = role === 'user';

    const row = document.createElement('div');
    row.className = `msg-row ${role}`;

    row.innerHTML = `
      <div class="avatar">${isUser ? '👤' : '🤖'}</div>
      <div>
        <div class="bubble">${escapeHtml(text)}</div>
        <div class="time">${now()}</div>
      </div>
    `;

    chatArea.appendChild(row);
    scrollToBottom();
    return row;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function scrollToBottom() {
    requestAnimationFrame(() => {
      chatArea.scrollTop = chatArea.scrollHeight;
    });
  }

  // ===================================================================
  // 打字指示器（三个跳动的小点）
  // ===================================================================
  function showTyping() {
    if (welcomeCard) welcomeCard.style.display = 'none';

    const row = document.createElement('div');
    row.className = 'typing-row';
    row.id = 'typingIndicator';
    row.innerHTML = `
      <div class="avatar" style="background:#e0e7ff;">🤖</div>
      <div class="typing-dots">
        <span></span><span></span><span></span>
      </div>
    `;
    chatArea.appendChild(row);
    scrollToBottom();
  }

  function hideTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  // ===================================================================
  // 设置等待状态（禁用输入）
  // ===================================================================
  function setWaiting(waiting) {
    isWaiting = waiting;
    userInput.disabled = waiting;
    sendBtn.disabled = waiting;
    if (!waiting) userInput.focus();
  }

  // ===================================================================
  // 发送消息
  // ===================================================================
  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text || isWaiting) return;

    // 清空输入框
    userInput.value = '';
    userInput.style.height = 'auto';

    // 显示用户消息
    addMessage('user', text);

    // 显示打字动画
    setWaiting(true);
    showTyping();

    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_key: sessionKey }),
      });

      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

      const data = await resp.json();

      // 移除打字动画，显示回复
      hideTyping();
      addMessage('agent', data.reply);

    } catch (err) {
      hideTyping();
      addMessage('agent', `⚠️ 请求失败: ${err.message}`);
    } finally {
      setWaiting(false);
    }
  }

  // ===================================================================
  // 事件绑定
  // ===================================================================
  sendBtn.addEventListener('click', sendMessage);

  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // 自动调整输入框高度
  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
  });

  // 页面加载完自动聚焦
  userInput.focus();
</script>

</body>
</html>
